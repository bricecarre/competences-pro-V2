name: Publier Competences Pro V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competences-pro-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4
      - name: Preparer le dossier public
        run: |
          mkdir -p site
          if ! grep -q 'function teacherNotesPage(' index.html; then python3 scripts/patch_notes_v237.py index.html; fi
          python3 scripts/patch_notes_v238.py index.html
          python3 scripts/patch_notes_v239.py index.html
          python3 scripts/patch_notes_v240.py index.html
          python3 scripts/patch_notes_v241.py index.html
          python3 scripts/patch_academy_map_mobile_v243.py index.html
          python3 scripts/patch_version_v243.py index.html
          python3 scripts/patch_cloud_v244.py index.html
          python3 scripts/strip_embedded_seed_v244.py index.html
          python3 scripts/patch_notes_v245.py index.html
          python3 scripts/patch_student_radar_v246.py index.html
          python3 scripts/patch_student_notes_v246.py index.html
          python3 scripts/patch_student_nav_v247.py index.html
          python3 scripts/patch_lazy_student_v248.py index.html
          python3 scripts/patch_student_pfmp_v249.py index.html
          python3 scripts/patch_pfmp_journal_v250.py index.html
          cp index.html site/index.html
          cp sauvegarde-en-ligne.html site/sauvegarde-en-ligne.html
          cp cloud-sync-v244.js site/cloud-sync-v244.js
          # Bibliothèque Supabase servie localement : aucun CDN externe nécessaire au démarrage.
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @supabase/supabase-js@2.57.0
          ./node_modules/.bin/esbuild node_modules/@supabase/supabase-js/dist/module/index.js --bundle --format=esm --platform=browser --target=es2020 --outfile=site/supabase-client.js
          test -s site/supabase-client.js
          node --check site/supabase-client.js
          test -s site/sauvegarde-en-ligne.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('site/sauvegarde-en-ligne.html').read_text(encoding='utf-8')
          assert 'cp-private-backups' in s and 'cp_backup_manifests' in s
          assert 'crypto.subtle.digest' in s and '5*1024*1024' in s
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          assert len(blocks)==1
          Path('/tmp/cp-backup-uploader.mjs').write_text(blocks[0],encoding='utf-8')
          print('Chargeur privé : structure validée')
          PY
          node --check /tmp/cp-backup-uploader.mjs
          node --check site/cloud-sync-v244.js
          grep -q "import('./supabase-client.js')" site/cloud-sync-v244.js
          grep -q 'loadedSections.has' site/cloud-sync-v244.js
          grep -q 'cp_pfmp_activity_entries' site/cloud-sync-v244.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('site/index.html').read_text(encoding='utf-8')
          assert "['notes','Notes']" in s
          assert "function teacherNotesPage(" in s
          assert "function teacherNotesSemesterAssignment(" in s
          assert "Moy. S1" in s and "Moy. S2" in s
          assert "data-notes-heading-vertical-v239" in s
          assert "notes-scroll-v240" in s
          assert "data-notes-cut" in s
          assert "teacherNotesSemesterCutoffs" in s
          assert "data-notes-layout-v241" in s
          assert "Moy. année" in s
          assert "academy-map-tactile-v243" in s
          assert "<title>Compétences Pro V2.50" in s
          assert "data-pfmp-activity-journal-v250" in s
          assert "function cpPfmpStudentDiary(" in s
          assert "function cpPfmpTeacherDiary(" in s
          assert "['pfmp','Mes PFMP']" in s
          assert "if(section==='pfmp'||section==='mobilepfmp')" in s
          assert 'data-s="pfmp"><span class="mobile-nav-icon">🏭</span><span class="mobile-nav-label">Mes PFMP' in s
          assert "data-cp-lazy-v248" in s
          assert "cpCloudEnsureSequences" in s
          assert "['notes','Mes notes']" not in s
          assert 'data-s="notes"><span class="mobile-nav-icon"' not in s
          assert 'data-s="mobileevals"><span class="mobile-nav-icon"' in s
          assert "function studentRadarPartialScore(" in s
          assert "function studentNotesPage(" in s
          assert "data-student-notes-v246" in s
          assert "studentNotesPage();" in s
          assert "data-notes-readability-v245" in s
          assert "nameColWidth" in s
          assert "notes-student-row-v245" in s
          assert '<script src="cloud-sync-v244.js"></script>' in s
          assert "window.cpCloudInitialize(root)" in s
          assert "let data=JSON.parse(JSON.stringify(seed))" in s
          assert len(s)<12_000_000, "Le HTML contient encore le gros jeu de données"
          assert "academy-mobile-select-v242" not in s
          assert "academy-premium-hit" in s
          assert "annualMean(st)" in s
          assert "filter(code=>String(code||'').trim().length>0)" in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          assert scripts, "Script application absent"
          Path('/tmp/competences-pro-validation.js').write_text(scripts[-1],encoding='utf-8')
          print('V2.44: moteur de données en ligne et carte tactile validés')
          PY
          node --check /tmp/competences-pro-validation.js
      - name: Conserver la version corrigée dans le dépôt
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Publier V2.50 : carnet PFMP élève et consultation par le professeur"
            git push origin HEAD:main
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier le démarrage du site publié
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "$SITE_URL/supabase-client.js" -o /tmp/supabase-site.js && test -s /tmp/supabase-site.js; then
              break
            fi
            sleep 5
          done
          test -s /tmp/supabase-site.js
          command -v google-chrome
          timeout 55s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$SITE_URL" > /tmp/cp-dom.html 2>/tmp/cp-browser.log || {
            tail -60 /tmp/cp-browser.log
            exit 1
          }
          if ! grep -q 'cp-cloud-login-form' /tmp/cp-dom.html; then
            echo "Echec : le formulaire de connexion n'apparaît pas dans le navigateur."
            tail -60 /tmp/cp-browser.log
            tail -c 2500 /tmp/cp-dom.html
            exit 1
          fi
          echo 'OK : page publiée, bibliothèque locale chargée, formulaire de connexion visible.'

