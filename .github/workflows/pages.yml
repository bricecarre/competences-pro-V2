name: Publier Competences Pro V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competences-pro-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4
      - name: Preparer le dossier public
        run: |
          mkdir -p site
          python3 scripts/patch_notes_v237.py index.html
          cp index.html site/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('site/index.html').read_text(encoding='utf-8')
          assert "['notes','Notes']" in s
          assert "function teacherNotesPage(" in s
          assert "filter(code=>String(code||'').trim().length>0)" in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          assert scripts, "Script application absent"
          Path('/tmp/competences-pro-validation.js').write_text(scripts[-1],encoding='utf-8')
          print('V2.37: navigation, tableau et compteurs vérifiés')
          PY
          node --check /tmp/competences-pro-validation.js
      - name: Conserver la version corrigée dans le dépôt
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Publier la version V2.37 avec le menu Notes et les compteurs corrigés"
            git push origin HEAD:main
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
