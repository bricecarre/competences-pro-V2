name: Publier Competences Pro V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: competences-pro-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4
      - name: Preparer le dossier public
        run: |
          mkdir -p site
          cp index.html site/index.html
          python3 scripts/patch_pfmp_v236.py site/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('site/index.html').read_text(encoding='utf-8')
          assert 'V2.36 : afficher aussi' in s
          assert 'openPfmpTimeline' in s
          print('Controle de publication PFMP V2.36 valide')
          PY
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
