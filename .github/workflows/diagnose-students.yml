name: Diagnostiquer formulaire PFMP lecture seule
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trouver exactement le formulaire PFMP affiché
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['Enregistrer mon activité','Activités réalisées','Date de début','cp-pfmp-journal-v250']:
            positions=[]
            start=0
            while len(positions)<5:
              at=s.find(term,start)
              if at<0:break
              positions.append(at)
              start=at+len(term)
            print('CP_PFMP_TERM',term,'positions',positions)
            for at in positions:
              sample=s[max(0,at-1600):at+850]
              print('CP_PFMP_SNIPPET',repr(sample[:2500]))
          PY
