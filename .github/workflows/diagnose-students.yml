name: Diagnostic formulaire profils (lecture seule)
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examiner les formulaires d'identité
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function editEntity(', 'function editStudent(', 'function editTeacher(', 'function student(', 'function teacher(', 'function profile(', 'function editProfile(', 'function admin(', 'function name(']:
            p=s.find(needle)
            if p<0:continue
            q=s.find('\nfunction ',p+12)
            if q<0:q=min(len(s),p+18000)
            content=s[p:min(q,p+23000)]
            print('CP_PROFILE_START',needle,'LEN',len(content))
            for line in content.splitlines():print('CP_CODE',line[:1100])
            print('CP_PROFILE_END')
          PY
