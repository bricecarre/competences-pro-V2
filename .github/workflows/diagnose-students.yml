name: Inspection bilan global PFMP
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examiner la vue de notation générale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['function evaluatePfmp(', 'function pfmpEvaluationOverview(', 'function pfmpEvaluationStudentDetail(', 'function cpPfmpTeacherDiary(']:
            a=s.find(term)
            b=s.find('\nfunction ',a+20) if a>=0 else -1
            print('PFMP_VIEW_START',term,'length',b-a)
            if a>=0:
              snippet=s[a:(b if b>0 else a+12000)]
              print(snippet[:25000])
              print('PFMP_VIEW_END')
          PY
