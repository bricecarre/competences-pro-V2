name: Inspect annual student report code
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find annual report and assessment aggregation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['function bilan','function annual','function studentReport','function competencyAverageScore','function pfmpCompetencyStatuses','bilan annuel','Bilan annuel','Bilan de l','bilanStudent','annualMean','function studentProgress']
          for t in terms:
            ms=list(re.finditer(re.escape(t),s,re.I))
            print('CP_ANNUAL_TERM',t,'COUNT',len(ms))
            for m in ms[:9]:
              p=m.start()
              print('CP_ANNUAL_EXCERPT',t,repr(s[max(0,p-320):min(len(s),p+800)]))
          for m in re.finditer(r'function\s+([\w]*[Bb]ilan[\w]*|[\w]*[Aa]nnual[\w]*|[\w]*[Pp]rogress[\w]*)\s*\(',s):
            print('CP_ANNUAL_FUN',m.group(1),'OFFSET',m.start())
          PY
