name: Inspect student annual report implementation
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect annual student report code only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function studentBilan(', 'function studentDetail(', 'function studentFormationProgressHtml(', 'function pfmpCompetencyStatuses(', 'function competencyCoverage(', 'function studentPfmpForYear(']:
            a=s.find(needle)
            b=s.find('\\nfunction ',a+15)
            if b<0:b=len(s)
            print('CP_BLOCK_START',needle,'LENGTH',b-a)
            if a>=0:
              piece=s[a:min(b,a+25000)]
              print(piece)
              print('CP_BLOCK_END')
          PY
