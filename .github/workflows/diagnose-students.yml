name: Diagnostic archivage élèves (lecture seule)
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Examiner l'archivage sans afficher de données personnelles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function bindCrud(', 'function listStudents(', 'function save(', "if(type==='student')", "type==='student'", 'student.archived=true','st.archived=true', "cpRepairKnownRepeatersV254", 'function student(', 'function teacher(']:
            p=s.find(needle)
            print('CP_ARCHIVE_NEEDLE',repr(needle),'INDEX',p)
            if p>=0:
              snippet=s[max(0,p-500):p+7500]
              for ln in snippet.splitlines():print('CP_CODE',ln[:600])
              print('CP_ARCHIVE_END')
          PY
