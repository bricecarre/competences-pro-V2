name: Diagnostic structure évaluation PFMP
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspection code local, sans données élèves
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function pfmpEvalStats(', 'function pfmpEvaluationStudentDetail(', 'function evaluatePfmp(', 'function studentApplicablePfmps(', 'function studentReferentialData(']:
            p=s.find(needle)
            if p<0:
              print('MISSING',needle)
              continue
            end=s.find('\nfunction ',p+12)
            if end<0:end=p+12000
            piece=s[p:min(end,p+11000)]
            print('CP_PFMP_FUNC',needle)
            print(piece)
            print('CP_END_FUNC')
          PY
