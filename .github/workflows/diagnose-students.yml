name: Diagnose intégration PFMP professeur
on:
  push:
    paths: ['.github/workflows/diagnose-students.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecter fonctions PFMP sans données personnelles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function cpPfmpTeacherDiary(', 'function studentReferentialData(', 'function pfmpEvalResult(', 'function cpPfmpStudentDiary(']:
            p=s.find(needle)
            print('FUNCTION',needle,'OFFSET',p)
            if p>=0:
              q=s.find('\\nfunction ',p+20)
              if q<0:q=p+8500
              print(s[p:min(q,p+8500)])
          PY
